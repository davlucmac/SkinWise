services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: skinwise
      POSTGRES_USER: skinwise
      POSTGRES_PASSWORD: skinwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations
      - ./db/seed:/docker-entrypoint-initdb.d/seed

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://skinwise:skinwise@db:5432/skinwise
      BASIC_ADMIN_USER: admin
      BASIC_ADMIN_PASSWORD: admin
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
